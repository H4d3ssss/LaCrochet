<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Background -->
  <rect width="500" height="500" fill="#F8F9FA" />

  <!-- Logo Icon Group -->
  <g transform="translate(250, 190)">
    <!-- Outer Yarn Loop -->
    <path d="M-60,-20 C-90,-60 -30,-110 20,-70 C70,-30 80,40 20,80 C-40,120 -100,50 -60,-20 Z" fill="none" stroke="#F05D5E" stroke-width="12" stroke-linecap="round" />
    
    <!-- Inner 3D Print Layer Lines -->
    <path d="M-45,-15 C-68,-45 -23,-83 15,-53 C53,-23 60,30 15,60 C-30,90 -75,38 -45,-15 Z" fill="none" stroke="#00A896" stroke-width="6" stroke-dasharray="10 6" stroke-linecap="round" />

    <!-- 3D Printer Nozzle Detail -->
    <path d="M 50,-80 L 70,-80 L 65,-65 L 55,-65 Z" fill="#2B2D42" />
    <rect x="58" y="-90" width="14" height="10" fill="#2B2D42" rx="2" />
    
    <!-- Yarn Strand coming from Nozzle -->
    <path d="M 60,-65 C 55,-50 40,-45 20,-70" fill="none" stroke="#00A896" stroke-width="4" />
  </g>

  <!-- Typography -->
  <text x="250" y="340" font-family="&#39;Montserrat&#39;, &#39;Arial&#39;, sans-serif" font-weight="800" font-size="38" fill="#2B2D42" text-anchor="middle" letter-spacing="4">
    LA CROCHET
  </text>
  
  <text x="250" y="375" font-family="&#39;Josefin Sans&#39;, &#39;Arial&#39;, sans-serif" font-weight="500" font-size="16" fill="#00A896" text-anchor="middle" letter-spacing="6">
    YARNS & 3D PRINTING
  </text>
  
  <!-- Divider Line -->
  <line x1="180" y1="395" x2="320" y2="395" stroke="#F05D5E" stroke-width="3" stroke-linecap="round" />
</svg>